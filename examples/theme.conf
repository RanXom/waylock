# Example theme for waylock-custom.
# Copy to ~/.config/waylock/theme.conf or pass -config <path>.
#
# Global keys must come before the first [widget.*] section. Use [global] to
# switch back to global keys after a widget section.

# Pre-blurred wallpaper. Omit to use background_color instead.
background_image = /home/ranxom/.cache/swaylock-bg.png

# Desktop snapshot captured by lock-session before locking. Used for the
# crossfade in and out; if missing, only the UI fades over the wallpaper.
transition_image = /home/ranxom/.cache/waylock-transition.png

background_color = #131315

surface_color = #1f1f21
surface_opacity = 0.80

text_color = #e4e2e4
primary_color = #b8c7e7
error_color = #ffb4ab
outline_color = #8f9098

# Password field geometry and position. x/y are offsets from the anchor;
# positive x moves right and positive y moves down.
box_width = 190
box_height = 34
border_radius = 0
box_anchor = center
box_x = 0
box_y = 0

dot_spacing = 9
dot_radius = 2.4

# Defaults for text widgets. font_size can be overridden per widget.
font_family = sans
font_size = 16

# Fade in/out duration in milliseconds (0 disables the fade).
fade_ms = 250

# Optional widget examples. Uncomment to use.
#
# [widget.hostname]
# type = text
# text = legion
# anchor = top-center
# x = 0
# y = 40
# font_size = 18
# color = #e4e2e4
# opacity = 0.9
#
# [widget.avatar]
# type = image
# image = /home/ranxom/Pictures/avatar.png
# anchor = bottom-right
# x = -32
# y = -32
# width = 64
# height = 64
# opacity = 0.9
