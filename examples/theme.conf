# Example theme for waylock-custom.
# Copy to ~/.config/waylock/theme.conf or pass -config <path>.

# Pre-blurred wallpaper. Omit to use background_color instead.
background_image = /home/ranxom/.cache/swaylock-bg.png
background_color = #131315

surface_color = #1f1f21
surface_opacity = 0.80

text_color = #e4e2e4
primary_color = #b8c7e7
error_color = #ffb4ab
outline_color = #8f9098

box_width = 170
box_height = 30
border_radius = 0
dot_spacing = 9
dot_radius = 2.4
