# Matugen template for waylock-custom.
# Register in ~/.config/matugen/config.toml:
#
#   [templates.waylock]
#   input_path = "/home/ranxom/.config/matugen/templates/waylock.conf"
#   output_path = "/home/ranxom/.config/waylock/theme.conf"

background_image = /home/ranxom/.cache/swaylock-bg.png
background_color = {{ colors.surface.default.hex }}
surface_color = {{ colors.surface_container.default.hex }}
surface_opacity = 0.80
text_color = {{ colors.on_surface.default.hex }}
primary_color = {{ colors.primary.default.hex }}
error_color = {{ colors.error.default.hex }}
outline_color = {{ colors.outline.default.hex }}

box_width = 190
box_height = 34
border_radius = 0
box_anchor = center
box_x = 0
box_y = 0

dot_spacing = 9
dot_radius = 2.4

font_family = sans
font_size = 16
fade_ms = 250

